name: Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  # actions: read — the called workflow's respond job lists workflow runs
  # for its cycle guard.  A called workflow may not request more than its
  # caller grants, so omitting this fails the whole run at startup.
  actions: read
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: TodoTik/todotik-ops/.github/workflows/code-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
